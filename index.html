<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Web Games</title>
  <style>
    :root{color-scheme:dark;--bg:#070b0a;--panel:#101714;--line:rgba(255,255,255,.1);--text:#f5f7f6;--muted:#93a39d;--accent:#9ef01a}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#132019 0,#070b0a 55%);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    main{width:min(920px,calc(100% - 32px));margin:0 auto;padding:56px 0 80px}h1{margin:0 0 10px;font-size:clamp(32px,6vw,58px)}p{color:var(--muted);font-size:17px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px;margin-top:36px}
    a.card{display:block;padding:24px;border:1px solid var(--line);border-radius:20px;background:rgba(16,23,20,.9);color:inherit;text-decoration:none;transition:.18s transform,.18s border-color}.card:hover{transform:translateY(-3px);border-color:rgba(158,240,26,.55)}
    .title{font-size:24px;font-weight:800;margin-bottom:8px}.play{display:inline-block;margin-top:18px;color:var(--accent);font-weight:800}
  </style>
</head>
<body>
  <main>
    <h1>Web Games</h1>
    <p>Коллекция браузерных игр. Каждая игра находится в отдельной папке репозитория.</p>
    <section class="grid">
      <a class="card" href="./snake/">
        <div class="title">Змейка</div>
        <div>Плавная браузерная версия классической Snake.</div>
        <span class="play">Играть →</span>
      </a>
      <a class="card" href="./minesweeper/">
        <div class="title">Сапёр</div>
        <div>Классический Minesweeper с современным интерфейсом.</div>
        <span class="play">Играть →</span>
      </a>
    </section>
  </main>
</body>
</html>
